name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only (the package has no runtime dependencies)
        run: python -m pip install --upgrade pip pytest
      - name: Tests (warnings are errors)
        run: python -m pytest -q
      - name: Validate example personalities
        run: |
          python -m identity_runtime validate personalities/tesla.json
          python -m identity_runtime validate personalities/sparky.json
          ! python -m identity_runtime validate examples/malicious.json
      - name: Lifecycle demo
        run: python -m identity_runtime demo > /dev/null
      - name: Installed console script
        run: |
          python -m pip install .
          cd "$RUNNER_TEMP" && identity-runtime --version
